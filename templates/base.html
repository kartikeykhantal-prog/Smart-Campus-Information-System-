<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus Information System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for beautiful charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Main Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fa-solid fa-graduation-cap brand-icon"></i>
                <span class="brand-name">Smart Campus</span>
            </div>
            
            <nav class="sidebar-menu">
                <a href="#dashboard" class="menu-item active" data-tab="dashboard">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#students" class="menu-item" data-tab="students">
                    <i class="fa-solid fa-user-graduate"></i>
                    <span>Students</span>
                </a>
                <a href="#courses" class="menu-item" data-tab="courses">
                    <i class="fa-solid fa-book-bookmark"></i>
                    <span>Courses</span>
                </a>
                <a href="#fees" class="menu-item" data-tab="fees">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Fee Calculator</span>
                </a>
                <a href="#scanner" class="menu-item" data-tab="scanner">
                    <i class="fa-solid fa-folder-tree"></i>
                    <span>Directory Scanner</span>
                </a>
                <a href="#file-mgmt" class="menu-item" data-tab="file-mgmt">
                    <i class="fa-solid fa-database"></i>
                    <span>File Manager</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <h1 id="page-title">Analytics Dashboard</h1>
                    <p id="page-subtitle">Overview of campus performance and metrics</p>
                </div>
                <div class="header-right">
                    <div class="status-indicator">
                        <span class="status-dot"></span>
                        <span class="status-text">System Active</span>
                    </div>
                </div>
            </header>

            <div class="content-body">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden">
        <i id="toast-icon" class="fa-solid fa-circle-info"></i>
        <span id="toast-message">Notification message here</span>
    </div>

    <!-- Script Source -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
